name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test 'web-tests/*.test.cjs'
      # No signing key in CI: the release build is produced unsigned, which still compiles, shrinks and lints the real app.
      - run: ./gradlew --no-daemon testSolitaryReleaseUnitTest lintSolitaryRelease assembleSolitaryRelease assembleSolitaryDebug
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
